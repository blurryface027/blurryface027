<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <rect width="900" height="220" rx="14" fill="#000000"/>
  <rect x="1" y="1" width="898" height="218" rx="13" fill="none" stroke="#E50914" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="0" y1="42" x2="900" y2="42" stroke="#E50914" stroke-opacity="0.35"/>
  <circle cx="26" cy="21" r="6" fill="none" stroke="#E50914" stroke-width="1.4"/>
  <circle cx="46" cy="21" r="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.4"/>
  <circle cx="66" cy="21" r="6" fill="none" stroke="#E50914" stroke-opacity="0.5" stroke-width="1.4"/>
  <text x="450" y="26" fill="#FFFFFF" fill-opacity="0.5" font-size="12" text-anchor="middle">krishan@github: ~</text>

  <text x="26" y="70" fill="#FFFFFF" font-size="16"><tspan fill-opacity="0.5">$</tspan> whoami</text>

  <g font-size="15" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.3s" fill="freeze"/>
    <text x="26" y="102" fill="#E50914" font-weight="700">Krishan Mohan Sharma</text>
    <text x="26" y="126" fill-opacity="0.8">DevOps Engineer</text>
    <text x="26" y="150" fill-opacity="0.8">Cloud Enthusiast &#183; AWS &#183; Docker &#183; Kubernetes</text>
    <text x="26" y="174" fill-opacity="0.8">Linux Power User</text>
  </g>

  <text x="26" y="200" fill="#E50914" fill-opacity="0" font-size="14" font-weight="700">
    <animate attributeName="fill-opacity" from="0" to="1" begin="0.9s" dur="0.3s" fill="freeze"/>
    Automation First.
  </text>
  <rect x="248" y="185" width="9" height="17" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.001;0.5;0.501;1" begin="1.2s" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>

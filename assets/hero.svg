<svg viewBox="0 0 960 654" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, 'Fira Code', Consolas, monospace">
  <defs>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#ff3b47"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glowRed" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowWhite" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" from="0" to="430" begin="0.3s" dur="1.4s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="960" height="654" rx="14" fill="#000000"/>
  <rect x="1" y="1" width="958" height="758" rx="13" fill="none" stroke="#E50914" stroke-opacity="0.55" stroke-width="1.5"/>

  <rect x="0" y="0" width="960" height="46" rx="14" fill="url(#chromeGrad)"/>
  <rect x="0" y="32" width="960" height="14" fill="url(#chromeGrad)"/>
  <line x1="0" y1="46" x2="960" y2="46" stroke="#E50914" stroke-opacity="0.4" stroke-width="1"/>

  <circle cx="28" cy="23" r="6.5" fill="none" stroke="#E50914" stroke-width="1.6"/>
  <circle cx="50" cy="23" r="6.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-opacity="0.55"/>
  <circle cx="72" cy="23" r="6.5" fill="none" stroke="#E50914" stroke-width="1.6" stroke-opacity="0.55"/>

  <text x="480.0" y="28" fill="#FFFFFF" fill-opacity="0.55" font-size="12.5" text-anchor="middle" letter-spacing="1">krishan@github&#8202;:&#8202;~&#8202;/&#8202;deploy-profile.sh &#8212; 120x40</text>

  <!-- prompt + typed command -->
  <text x="26" y="82" font-size="17" fill="#FFFFFF">
    <tspan fill="#E50914">krishan</tspan><tspan fill="#FFFFFF" fill-opacity="0.6">@github</tspan><tspan fill="#FFFFFF">:~$</tspan>
  </text>
  <g clip-path="url(#typeClip)">
    <text x="130" y="82" font-size="17" fill="#FFFFFF">./deploy-profile.sh</text>
  </g>
  <rect x="560" y="66" width="9" height="19" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.001;0.5;0.501;1" begin="1.7s" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  <text x="26" y="128" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Booting Linux...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="2.05s" dur="0.28s" fill="freeze"/>
  </text>
  <text x="26" y="153" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Loading Environment Variables...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="2.55s" dur="0.28s" fill="freeze"/>
  </text>
  <text x="26" y="178" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Initializing Git...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="3.05s" dur="0.28s" fill="freeze"/>
  </text>
  <text x="26" y="203" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Creating Project...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="3.55s" dur="0.28s" fill="freeze"/>
  </text>
  <text x="26" y="228" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Writing Dockerfile...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="4.05s" dur="0.28s" fill="freeze"/>
  </text>
  <text x="26" y="253" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Building Docker Image...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="4.55s" dur="0.28s" fill="freeze"/>
  </text>
  <rect x="26" y="263" width="300" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="26" y="263" width="0" height="8" rx="4" fill="url(#barFill)">
    <animate attributeName="width" from="0" to="300" begin="4.90s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1" values="0;300"/>
  </rect>
  <text x="336" y="271" font-size="11.5" fill="#FFFFFF" fill-opacity="0" font-weight="600">
    <animate attributeName="fill-opacity" from="0" to="0.8" begin="5.80s" dur="0.2s" fill="freeze"/>
    100%
  </text>  <text x="26" y="298" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Running Container...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="6.15s" dur="0.28s" fill="freeze"/>
  </text>
  <rect x="26" y="308" width="300" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="26" y="308" width="0" height="8" rx="4" fill="url(#barFill)">
    <animate attributeName="width" from="0" to="300" begin="6.50s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1" values="0;300"/>
  </rect>
  <text x="336" y="316" font-size="11.5" fill="#FFFFFF" fill-opacity="0" font-weight="600">
    <animate attributeName="fill-opacity" from="0" to="0.8" begin="7.40s" dur="0.2s" fill="freeze"/>
    100%
  </text>  <text x="26" y="343" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Logging into AWS...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="7.75s" dur="0.28s" fill="freeze"/>
  </text>
  <text x="26" y="368" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Pushing Image to Amazon ECR...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="8.25s" dur="0.28s" fill="freeze"/>
  </text>
  <rect x="26" y="378" width="300" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="26" y="378" width="0" height="8" rx="4" fill="url(#barFill)">
    <animate attributeName="width" from="0" to="300" begin="8.60s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1" values="0;300"/>
  </rect>
  <text x="336" y="386" font-size="11.5" fill="#FFFFFF" fill-opacity="0" font-weight="600">
    <animate attributeName="fill-opacity" from="0" to="0.8" begin="9.50s" dur="0.2s" fill="freeze"/>
    100%
  </text>  <text x="26" y="413" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Creating ECS Cluster...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="9.85s" dur="0.28s" fill="freeze"/>
  </text>
  <text x="26" y="438" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Registering Task Definition...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="10.35s" dur="0.28s" fill="freeze"/>
  </text>
  <text x="26" y="463" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Launching Fargate Tasks...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="10.85s" dur="0.28s" fill="freeze"/>
  </text>
  <text x="26" y="488" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Configuring Load Balancer...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="11.35s" dur="0.28s" fill="freeze"/>
  </text>
  <text x="26" y="513" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">Running Health Checks...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="11.85s" dur="0.28s" fill="freeze"/>
  </text>
  <text x="26" y="538" font-size="15" fill="#FFFFFF" fill-opacity="0" font-weight="400">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="0.92">CloudWatch Enabled...</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="12.35s" dur="0.28s" fill="freeze"/>
  </text>
  <text x="26" y="563" font-size="15" fill="#E50914" fill-opacity="0" font-weight="700">
    <tspan fill-opacity="0.45">$</tspan> <tspan fill-opacity="1">Deployment Successful.</tspan>
    <animate attributeName="fill-opacity" from="0" to="1" begin="12.85s" dur="0.28s" fill="freeze"/>
  </text>

  <line x1="26" y1="592" x2="934" y2="592" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="13.55s" dur="0.4s" fill="freeze"/>
    <text x="26" y="624" font-size="13" fill="#FFFFFF" fill-opacity="0.5" letter-spacing="2">STATUS</text>
    <circle cx="130" cy="619" r="5" fill="#E50914" filter="url(#glowRed)">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" begin="13.75s" repeatCount="indefinite"/>
    </circle>
    <text x="145" y="624" font-size="15" fill="#E50914" font-weight="700" letter-spacing="3" filter="url(#glowRed)">LIVE</text>
  </g>
</svg>
<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <rect width="900" height="300" rx="14" fill="#000000"/>
  <rect x="1" y="1" width="898" height="298" rx="13" fill="none" stroke="#E50914" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="0" y1="42" x2="900" y2="42" stroke="#E50914" stroke-opacity="0.35"/>
  <circle cx="26" cy="21" r="6" fill="none" stroke="#E50914" stroke-width="1.4"/>
  <circle cx="46" cy="21" r="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.4"/>
  <circle cx="66" cy="21" r="6" fill="none" stroke="#E50914" stroke-opacity="0.5" stroke-width="1.4"/>
  <text x="450" y="26" fill="#FFFFFF" fill-opacity="0.5" font-size="12" text-anchor="middle">kubectl &amp; docker &#8212; cluster status</text>

  <text x="26" y="68" fill="#FFFFFF" font-size="14"><tspan fill-opacity="0.5">$</tspan> kubectl get pods</text>
  <g font-size="13" fill="#FFFFFF">
    <text x="26" y="96" fill-opacity="0.5">NAME</text>
    <text x="260" y="96" fill-opacity="0.5">STATUS</text>
    <text x="400" y="96" fill-opacity="0.5">RESTARTS</text>
    <text x="540" y="96" fill-opacity="0.5">AGE</text>
  </g>
  <line x1="26" y1="104" x2="700" y2="104" stroke="#FFFFFF" stroke-opacity="0.15"/>

  <!-- rows -->
  <g font-size="13" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.3s" fill="freeze"/>
    <text x="26" y="126">portfolio-7d9f8</text>
    <circle cx="270" cy="122" r="4" fill="#E50914"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="282" y="126">Running</text>
    <text x="400" y="126" fill-opacity="0.6">0</text>
    <text x="540" y="126" fill-opacity="0.6">14d</text>
  </g>
  <g font-size="13" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.3s" fill="freeze"/>
    <text x="26" y="150">aws-cicd-2ac41</text>
    <circle cx="270" cy="146" r="4" fill="#E50914"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <text x="282" y="150">Running</text>
    <text x="400" y="150" fill-opacity="0.6">0</text>
    <text x="540" y="150" fill-opacity="0.6">9d</text>
  </g>
  <g font-size="13" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.3s" fill="freeze"/>
    <text x="26" y="174">gitops-k8s-11bd3</text>
    <circle cx="270" cy="170" r="4" fill="#E50914"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <text x="282" y="174">Running</text>
    <text x="400" y="174" fill-opacity="0.6">0</text>
    <text x="540" y="174" fill-opacity="0.6">6d</text>
  </g>
  <g font-size="13" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.3s" fill="freeze"/>
    <text x="26" y="198">devsecops-9f001</text>
    <circle cx="270" cy="194" r="4" fill="#E50914"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <text x="282" y="198">Running</text>
    <text x="400" y="198" fill-opacity="0.6">0</text>
    <text x="540" y="198" fill-opacity="0.6">3d</text>
  </g>

  <text x="26" y="238" fill="#FFFFFF" font-size="14" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.3s" fill="freeze"/>
    <tspan fill-opacity="0.5">$</tspan> docker ps --filter status=running
  </text>
  <text x="26" y="264" fill="#FFFFFF" fill-opacity="0" font-size="12">
    <animate attributeName="fill-opacity" from="0" to="0.85" begin="1.6s" dur="0.3s" fill="freeze"/>
    4 containers &#8212; all healthy &#8212; uptime 99.98%
  </text>
</svg>

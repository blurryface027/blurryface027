name: update-readme

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stamp last-deployed timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s#<!-- LAST_DEPLOY_START -->.*<!-- LAST_DEPLOY_END -->#<!-- LAST_DEPLOY_START -->\`${TIMESTAMP}\`<!-- LAST_DEPLOY_END -->#" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: sync deploy timestamp [skip ci]"
          git push
